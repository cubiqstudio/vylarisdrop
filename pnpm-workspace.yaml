onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
enablePrePostScripts: true
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  # ssh2 (SFTP-Erweiterungen) läuft auch ohne die optionalen nativen Beschleuniger; kein Compiler im Build nötig
  cpu-features: false
  ssh2: false
overrides:
  '@vue/shared': 3.5.42
  '@vue/reactivity': 3.5.42
  '@vue/runtime-core': 3.5.42
  '@vue/runtime-dom': 3.5.42
  '@vue/server-renderer': 3.5.42
  '@vue/compiler-core': 3.5.42
  '@vue/compiler-dom': 3.5.42
  '@vue/compiler-sfc': 3.5.42
  '@vue/compiler-ssr': 3.5.42
  tslib: 2.8.1
  '@types/node': 26.6.5
