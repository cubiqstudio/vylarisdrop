# fail2ban-Filter fuer das Caddy-Zugriffsprotokoll des direkten WebDAV-Hostnamens (JSON, ./caddy-logs/dav-zugriff.log).
# Zaehlt NUR Anfragen MIT Anmelde-Kopf (Authorization, von Caddy als REDACTED protokolliert), die mit 401 abgelehnt wurden:
# Windows und andere Clients schicken jede neue Verbindung zuerst OHNE Anmeldung (-> 401) und melden sich erst dann an.
# Diese Erst-Anfragen sind normal und duerfen nie zu einer Sperre fuehren.
[Definition]
failregex = ^\{.*"remote_ip":"<HOST>".*"Authorization":\["REDACTED"\].*"status":401[,}]
ignoreregex =
